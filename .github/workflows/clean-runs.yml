name: Clean Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      days:
        description: "清理多少天之前的历史记录"
        required: true
        default: "3"
      minimum_runs:
        description: "至少保留的运行记录数量"
        required: true
        default: "3"

permissions:
  actions: write

jobs:
  clean-runs:
    # 同步切回官方推荐的最稳 22.04 环境
    runs-on: ubuntu-22.04

    steps:
      - name: "清理旧的 Workflow 运行历史"
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ github.event.inputs.days }}
          keep_minimum_runs: ${{ github.event.inputs.minimum_runs }}
