name: Clean Old Workflow Runs

on:
  schedule:
    # 每月 1 号国际标准时间 00:00 自动运行
    - cron: "0 0 1 * *"
  # 支持在 GitHub Actions 页面手动点击触发
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete-runs:
    runs-on: ubuntu-24.04
    steps:
      - name: "清理历史工作流构建记录"
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 14 # 保留近 14 天内的构建记录
          keep_minimum_runs: 3 # 最少保留最近 3 次记录，避免清空
