name: Build ImmortalWrt 25.12 for NanoPi R2S

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: "开启 SSH 调试"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # =====================================================
      # 0. 获取 YAIF 仓库
      # =====================================================

      - name: Checkout YAIF
        uses: actions/checkout@v4

      # =====================================================
      # 1. 编译环境
      #
      # 对齐 ImmortalWrt 官方要求
      #
      # Ubuntu 22.04
      # AMD64 runner
      #
      # =====================================================

      - name: Install build dependencies

        env:
          DEBIAN_FRONTEND: noninteractive

        run: |

          sudo apt-get update -y

          sudo apt-get full-upgrade -y


          sudo apt-get install -y \
            ack-grep \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            lrzsz \
            mkisofs \
            msmtp \
            nano \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            upx-ucl \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            zstd



          # Ubuntu22.04兼容
          # ImmortalWrt 构建环境需要 ack

          sudo ln -sf \
            /usr/bin/ack-grep \
            /usr/local/bin/ack



          sudo apt-get clean

      # =====================================================
      # 2. 拉取 ImmortalWrt 25.12.1源码
      #
      # 官方 Quickstart:
      # git clone -b <branch>
      # --single-branch
      # --filter=blob:none
      #
      # =====================================================

      - name: Clone ImmortalWrt v25.12.1

        run: |

          git clone \
            -b v25.12.1 \
            --single-branch \
            --filter=blob:none \
            https://github.com/immortalwrt/immortalwrt \
            immortalwrt

      # =====================================================
      # 3. 更新 feeds
      #
      # Diy-Part1:
      #
      # 负责:
      # - 添加 Nikki feed
      # - 其它自定义源
      #
      # =====================================================

      - name: Update feeds

        run: |


          cd immortalwrt


          chmod +x \
            ../device/r2s/Diy-Part1.sh


          ../device/r2s/Diy-Part1.sh



          ./scripts/feeds update -a



          ./scripts/feeds install -a

      # =====================================================
      # 4. 注入 files
      #
      # 例如:
      # /etc/config
      # /etc/init.d
      # 默认网络配置
      #
      # 不修改 .config
      #
      # =====================================================

      - name: Inject files

        run: |


          cd immortalwrt


          chmod +x \
            ../device/r2s/Diy-Part2.sh


          ../device/r2s/Diy-Part2.sh

      # =====================================================
      # 5. 应用 config.seed
      #
      # 唯一配置入口
      #
      # config.seed
      #       |
      #       v
      # make defconfig
      #       |
      #       v
      # .config
      #
      # =====================================================

      - name: Apply R2S config.seed

        run: |


          cd immortalwrt


          cp \
            ../device/r2s/config.seed \
            .config



          make defconfig

      # =====================================================
      # 6. 检查最终 .config
      #
      # 重点:
      #
      # R2S
      # Nikki
      # Mihomo Meta
      # Alpha关闭
      # BTF
      # APK时代
      #
      # =====================================================

      - name: Verify final configuration

        run: |


          cd immortalwrt



          echo "===== TARGET ====="

          grep \
            "TARGET_" \
            .config \
            | grep -E \
            "rockchip|nanopi-r2s"



          echo "===== PARTITION ====="


          grep \
            -E \
            "TARGET_(KERNEL|ROOTFS)_PARTSIZE" \
            .config \
            || true




          echo "===== NIKKI / MIHOMO ====="


          grep \
            -E \
            "nikki|mihomo" \
            .config \
            || true




          echo "===== DAED ====="


          grep \
            -E \
            "daed|DAED" \
            .config \
            || true




          echo "===== BTF ====="


          grep \
            -E \
            "DEBUG_INFO|BTF" \
            .config \
            || true




          echo "===== APK CHECK ====="


          grep \
            "opkg" \
            .config \
            || true

      # =====================================================
      # 7. 保存最终配置
      #
      # 方便以后复现
      #
      # =====================================================

      - name: Check config file

        run: |

          ls -lh immortalwrt/.config

          test -f immortalwrt/.config

      - name: Upload final config

        uses: actions/upload-artifact@v4

        with:
          name: YAIF-R2S-final-config

          path: |

            ${{ github.workspace }}/immortalwrt/.config

      # =====================================================
      # 8. SSH 调试
      #
      # 手动开启
      #
      # =====================================================

      - name: SSH debug

        if: ${{ inputs.ssh == true }}

        uses: mxschmitt/action-tmate@v3

        with:
          limit-access-to-actor: false

      # =====================================================
      # 9. 下载源码包
      #
      # 不重复 make defconfig
      #
      # =====================================================

      - name: Download sources

        run: |


          cd immortalwrt


          make download -j$(nproc)

      # =====================================================
      # 10. 编译
      #
      # 第一次:
      # -j2 保守验证
      #
      # =====================================================

      - name: Build firmware

        run: |


          cd immortalwrt


          make -j2 V=s

      # =====================================================
      # 11. 上传固件
      #
      # =====================================================

      - name: Upload firmware

        uses: actions/upload-artifact@v4

        with:
          name: ImmortalWrt-NanoPi-R2S

          path: |


            immortalwrt/bin/targets/rockchip/armv8/*sysupgrade.img.gz
