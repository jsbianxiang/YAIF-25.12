name: Build ImmortalWrt 25.12 for NanoPi R2S

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: "开启 SSH 调试"

        required: false

        type: boolean

        default: false

      release:
        description: "发布 GitHub Release"

        required: false

        type: boolean

        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # =====================================================
      # 0. Checkout YAIF
      # =====================================================

      - name: Checkout YAIF

        uses: actions/checkout@v4

      # =====================================================
      # 1. 释放空间
      # =====================================================

      - name: Free disk space

        run: |

          sudo rm -rf /usr/local/lib/android

          sudo rm -rf /usr/share/dotnet

          sudo docker image prune --all --force || true


          df -h

      # =====================================================
      # 2. 安装编译环境
      # =====================================================

      - name: Install build dependencies

        env:
          DEBIAN_FRONTEND: noninteractive

        run: |


          sudo apt-get update -y


          sudo apt-get install -y \

            ack-grep \

            antlr3 \

            asciidoc \

            autoconf \

            automake \

            autopoint \

            binutils \

            bison \

            build-essential \

            bzip2 \

            ccache \

            clang \

            cmake \

            cpio \

            curl \

            device-tree-compiler \

            flex \

            gawk \

            gettext \

            gcc-multilib \

            g++-multilib \

            git \

            gperf \

            help2man \

            intltool \

            lib32gcc-s1 \

            libc6-dev-i386 \

            libelf-dev \

            libglib2.0-dev \

            libncurses-dev \

            libpython3-dev \

            libssl-dev \

            libtool \

            llvm \

            lld \

            ninja-build \

            patch \

            pkgconf \

            python3 \

            python3-pip \

            python3-ply \

            python3-pyelftools \

            rsync \

            squashfs-tools \

            unzip \

            wget \

            zlib1g-dev \

            zstd



          sudo ln -sf \

            /usr/bin/ack-grep \

            /usr/local/bin/ack

      # =====================================================
      # 3. 缓存
      # =====================================================

      - name: Cache ImmortalWrt build

        uses: actions/cache@v4

        with:
          path: |


            immortalwrt/dl

            immortalwrt/staging_dir

            immortalwrt/build_dir

          key: immortalwrt-r2s-${{ runner.os }}-${{ hashFiles('device/r2s/config.seed') }}

          restore-keys: immortalwrt-r2s-${{ runner.os }}-

      # =====================================================
      # 4. Clone ImmortalWrt
      # =====================================================

      - name: Clone ImmortalWrt v25.12.1

        run: |


          git clone \

            -b v25.12.1 \

            --single-branch \

            --filter=blob:none \

            https://github.com/immortalwrt/immortalwrt \

            immortalwrt

      # =====================================================
      # 5. feeds
      # =====================================================

      - name: Update feeds

        run: |


          cd immortalwrt


          chmod +x ../device/r2s/Diy-Part1.sh


          ../device/r2s/Diy-Part1.sh


          ./scripts/feeds update -a


          ./scripts/feeds install -a

      # =====================================================
      # 6. files注入
      # =====================================================

      - name: Inject files

        run: |


          cd immortalwrt


          chmod +x ../device/r2s/Diy-Part2.sh


          ../device/r2s/Diy-Part2.sh

      # =====================================================
      # 7. config.seed
      # =====================================================

      - name: Apply R2S config.seed

        run: |


          cd immortalwrt


          cp ../device/r2s/config.seed .config


          make defconfig

      # =====================================================
      # 8. 配置检查
      # =====================================================

      - name: Verify configuration

        run: |


          cd immortalwrt


          echo "===== TARGET ====="


          grep TARGET_ .config | grep -E "rockchip|nanopi-r2s"



          echo "===== DAED ====="


          grep -E "daed|DAED" .config || true



          echo "===== BTF ====="


          grep -E "DEBUG_INFO|BTF" .config || true



          echo "===== NIKKI / MIHOMO ====="


          grep -E "nikki|mihomo" .config || true

      # =====================================================
      # 9. 保存配置
      # =====================================================

      - name: Upload final config

        uses: actions/upload-artifact@v4

        with:
          name: YAIF-R2S-final-config

          retention-days: 90

          path: |


            immortalwrt/.config

            immortalwrt/feeds.conf.default

      # =====================================================
      # 10. SSH调试
      # =====================================================

      - name: SSH debug

        if: ${{ inputs.ssh == true }}

        uses: mxschmitt/action-tmate@v3

        with:
          limit-access-to-actor: false

      # =====================================================
      # 11. 下载源码
      # =====================================================

      - name: Download sources

        run: |


          cd immortalwrt


          make download -j$(nproc)

      # =====================================================
      # 12. 编译
      # =====================================================

      - name: Build firmware

        run: |


          cd immortalwrt


          make -j2 V=s

      # =====================================================
      # 13. 整理发布文件
      # =====================================================

      - name: Prepare release files

        run: |


          mkdir -p release



          cp immortalwrt/bin/targets/rockchip/armv8/*.img.gz release/



          cp immortalwrt/bin/targets/rockchip/armv8/sha256sums release/ || true



          cp immortalwrt/bin/targets/rockchip/armv8/config.buildinfo release/ || true



          cp immortalwrt/bin/targets/rockchip/armv8/*.manifest release/ || true



          ls -lh release

      # =====================================================
      # 14. Artifact
      # =====================================================

      - name: Upload firmware artifact

        uses: actions/upload-artifact@v4

        with:
          name: ImmortalWrt-NanoPi-R2S

          retention-days: 90

          path: release/

      # =====================================================
      # 15. GitHub Release
      # =====================================================

      - name: Create GitHub Release

        if: ${{ inputs.release == true }}

        uses: softprops/action-gh-release@v2

        with:
          tag_name: YAIF-25.12-R2S-${{ github.run_number }}

          name: YAIF-25.12 NanoPi R2S Build ${{ github.run_number }}

          body: |


            # YAIF-25.12 NanoPi R2S


            ImmortalWrt:

            25.12.1


            Target:

            rockchip armv8


            Device:

            FriendlyARM NanoPi R2S


            Kernel:

            Linux 6.12


            Features:


            - APK package system

            - DAED kernel BTF

            - Nikki/Mihomo support

            - IPv6 support



            Commit:

            ${{ github.sha }}

          files: |


            release/*
