name: Build ImmortalWrt 25.12.1 for NanoPi R2S

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: "开启 SSH 调试"
        required: false
        type: boolean
        default: false

      release:
        description: "发布 GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # =====================================================
      # 0. 获取 YAIF 仓库
      # =====================================================

      - name: Checkout YAIF

        uses: actions/checkout@v4

      # =====================================================
      # 1. 安装编译依赖
      #
      # 对齐 ImmortalWrt 官方构建环境
      #
      # Ubuntu 22.04
      # AMD64 Runner
      #
      # =====================================================

      - name: Install build dependencies

        env:
          DEBIAN_FRONTEND: noninteractive

        run: |


          sudo apt-get update -y


          sudo apt-get install -y \
            ack-grep \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            lrzsz \
            mkisofs \
            msmtp \
            nano \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            upx-ucl \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            zstd



          # Ubuntu 22.04 兼容
          # ImmortalWrt 构建需要 ack 命令


          sudo ln -sf \
            /usr/bin/ack-grep \
            /usr/local/bin/ack



          sudo apt-get clean

      # =====================================================
      # 2. 配置 ccache 缓存
      #
      # 用于加速重复编译
      #
      # =====================================================

      - name: Restore ccache

        uses: actions/cache@v4

        with:
          path: |

            ~/.ccache

          key: immortalwrt-25.12.1-r2s-ccache-v2-${{ runner.os }}

          restore-keys: |

            immortalwrt-25.12.1-r2s-ccache-v2

      - name: Setup ccache

        run: |


          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV


          ccache --max-size=8G


          ccache --set-config=compression=true


          ccache --show-stats

      - name: Enable ccache

        run: |


          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV


          which gcc


          gcc --version


          ccache --version

      # =====================================================
      # 3. 拉取 ImmortalWrt 25.12.1源码
      #
      # 使用浅克隆减少下载时间
      #
      # =====================================================

      - name: Clone ImmortalWrt v25.12.1

        run: |


          git clone \
            -b v25.12.1 \
            --single-branch \
            --depth=1 \
            --filter=blob:none \
            https://github.com/immortalwrt/immortalwrt \
            immortalwrt

      - name: Cache OpenWrt dl

        uses: actions/cache@v4

        with:
          path: |

            immortalwrt/dl

          key: immortalwrt-25.12.1-r2s-dl-${{ runner.os }}

          restore-keys: |

            immortalwrt-25.12.1-r2s-dl-

      # =====================================================
      # 4. 更新 feeds
      #
      # Diy-Part1:
      #
      # - 添加 Nikki feed
      # - 添加其它自定义源
      #
      # =====================================================

      - name: Update feeds

        run: |


          set -e


          cd immortalwrt



          chmod +x \
            ../device/r2s/Diy-Part1.sh



          ../device/r2s/Diy-Part1.sh



          ./scripts/feeds update -a



          ./scripts/feeds install -a -f

      # =====================================================
      # 5. 注入 files 文件
      #
      # 用于添加:
      #
      # - /etc/config
      # - /etc/init.d
      # - 默认系统配置
      #
      # 不修改 .config
      #
      # =====================================================

      - name: Inject files

        run: |


          cd immortalwrt



          chmod +x \
            ../device/r2s/Diy-Part2.sh



          ../device/r2s/Diy-Part2.sh

      # =====================================================
      # 6. 应用 R2S 配置种子
      #
      # 唯一配置入口:
      #
      # config.seed
      #       |
      #       v
      # make defconfig
      #       |
      #       v
      # .config
      #
      # =====================================================

      - name: Apply R2S config.seed

        run: |


          cd immortalwrt



          cp \
            ../device/r2s/config.seed \
            .config



          make defconfig

      # =====================================================
      # 7. 验证最终配置
      #
      # 检查:
      #
      # - NanoPi R2S目标
      # - Nikki + Mihomo Meta
      # - Daed代理
      # - Kernel BTF
      # - APK包管理器
      # - MUSL工具链
      #
      # =====================================================

      - name: Verify final configuration

        run: |


          cd immortalwrt



          echo "===== TARGET ====="



          grep -E \
            "CONFIG_TARGET_(rockchip|.*nanopi-r2s)" \
            .config || true




          echo "===== PARTITION ====="



          grep -E \
            "TARGET_(KERNEL|ROOTFS)_PARTSIZE" \
            .config || true




          echo "===== NIKKI / MIHOMO ====="



          grep -E \
            "nikki|mihomo" \
            .config || true




          echo "===== DAED ====="



          grep -E \
            "daed|DAED" \
            .config || true




          echo "===== BTF ====="



          grep -E \
            "DEBUG_INFO|BTF" \
            .config || true




          echo "===== PACKAGE MANAGER (APK/OPKG) ====="



          grep -E \
            "CONFIG_PACKAGE_(apk|opkg)" \
            .config || true




          echo "===== TOOLCHAIN ====="



          grep -E \
            "CONFIG_USE_MUSL|CONFIG_LIBC_USE_MUSL" \
            .config || true

      # =====================================================
      # 8. 保存最终配置
      #
      # 用于:
      #
      # - 后续复现
      # - 问题排查
      # - 版本比较
      #
      # =====================================================

      - name: Check config file

        run: |


          ls -lh immortalwrt/.config



          test -f immortalwrt/.config



          cp \
            immortalwrt/.config \
            YAIF-R2S-final.config



          ls -lh YAIF-R2S-final.config

      - name: Upload final config

        uses: actions/upload-artifact@v4

        with:
          name: YAIF-R2S-final-config

          retention-days: 90

          path: YAIF-R2S-final.config

      # =====================================================
      # 9. SSH 调试
      #
      # 手动开启
      #
      # 用于 Actions 环境排查
      #
      # =====================================================

      - name: SSH debug

        if: ${{ inputs.ssh == true }}

        uses: mxschmitt/action-tmate@v3

        with:
          limit-access-to-actor: false

      # =====================================================
      # 10. 下载源码包
      #
      # 提前下载所有依赖源码
      #
      # 不重新执行 defconfig
      #
      # =====================================================

      - name: Download sources

        run: |


          cd immortalwrt



          make download -j$(nproc)

      # =====================================================
      # 11. 编译固件
      #
      # 使用全部 CPU 核心
      #
      # V=s:
      # 输出详细编译日志
      #
      # =====================================================

      - name: Build firmware

        run: |


          cd immortalwrt



          make -j$(nproc) V=s

      # =====================================================
      # 12. 显示 ccache 状态
      #
      # 用于观察缓存命中情况
      #
      # =====================================================

      - name: Show ccache stats

        run: |


          ccache --show-stats

      # =====================================================
      # 13. 整理固件文件
      #
      # 输出:
      #
      # - sysupgrade 镜像
      # - sha256校验
      # - build信息
      # - manifest
      # - 最终配置
      #
      # =====================================================

      - name: Prepare firmware files

        run: |


          mkdir -p release




          cp \
            immortalwrt/bin/targets/rockchip/armv8/*sysupgrade.img.gz \
            release/ || true




          cp \
            immortalwrt/bin/targets/rockchip/armv8/sha256sums \
            release/ || true




          cp \
            immortalwrt/bin/targets/rockchip/armv8/config.buildinfo \
            release/ || true




          cp \
            immortalwrt/bin/targets/rockchip/armv8/*.manifest \
            release/ || true




          cp \
            immortalwrt/.config \
            release/YAIF-R2S.config




          ls -lh release

      # =====================================================
      # 14. 上传编译产物
      #
      # Actions Artifact:
      #
      # 保留90天
      #
      # =====================================================

      - name: Upload firmware

        uses: actions/upload-artifact@v4

        with:
          name: YAIF-25.12.1-R2S-${{ github.run_number }}

          retention-days: 90

          path: |

            release/

      # =====================================================
      # 15. 创建 GitHub Release
      #
      # 仅 release=true 时执行
      #
      # =====================================================

      - name: Create GitHub Release

        if: ${{ inputs.release == true }}

        uses: softprops/action-gh-release@v2

        with:
          tag_name: YAIF-25.12.1-R2S-build-${{ github.run_id }}

          name: YAIF-25.12.1 NanoPi R2S Build ${{ github.run_number }}

          body: |


            YAIF-25.12.1 NanoPi R2S


            ImmortalWrt 25.12.1



            Target:

            rockchip armv8



            Device:

            FriendlyARM NanoPi R2S



            Kernel:

            Linux 6.12



            Build:

            ${{ github.sha }}



            Artifact:


            - sysupgrade.img.gz

            - sha256sums

            - config.buildinfo

            - manifest

            - YAIF-R2S.config
