name: Build ImmortalWrt 25.12.1 for NanoPi R2S

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: "开启 SSH 调试"
        required: false
        type: boolean
        default: false

      release:
        description: "发布 GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # =====================================================
      # 0. 获取 YAIF 仓库
      # =====================================================

      - name: Checkout YAIF
        uses: actions/checkout@v4

      # =====================================================
      # 1. 安装编译依赖
      #
      # ImmortalWrt 25.12.1
      # Ubuntu 22.04
      # =====================================================

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive

        run: |
          set -e

          sudo apt-get update -y

          sudo apt-get install -y \
            ack-grep \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            lrzsz \
            mkisofs \
            msmtp \
            nano \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            upx-ucl \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            zstd

          # Ubuntu 22.04 / ImmortalWrt ack 兼容
          sudo ln -sf \
            /usr/bin/ack-grep \
            /usr/local/bin/ack

          sudo apt-get clean

      # =====================================================
      # 2. 拉取 ImmortalWrt v25.12.1
      # =====================================================

      - name: Clone ImmortalWrt v25.12.1
        run: |
          set -e

          git clone \
            -b v25.12.1 \
            --single-branch \
            --filter=blob:none \
            https://github.com/immortalwrt/immortalwrt \
            immortalwrt

      # =====================================================
      # 3. 更新 feeds
      # =====================================================

      - name: Update feeds
        run: |
          set -e

          cd immortalwrt

          echo "===== ImmortalWrt ====="
          pwd

          echo "===== YAIF R2S device files ====="
          ls -la ../device/r2s/

          chmod +x ../device/r2s/Diy-Part1.sh

          # 注入 Nikki feed / feeds 配置
          ../device/r2s/Diy-Part1.sh

          echo "===== feeds.conf.default ====="
          cat feeds.conf.default

          echo "===== Update feeds ====="
          ./scripts/feeds update -a

          echo "===== Install feeds ====="
          ./scripts/feeds install -a

      # =====================================================
      # 3.1 验证 feeds
      # =====================================================

      - name: Verify feeds
        run: |
          set -e

          cd immortalwrt

          test -d feeds/nikki || {
            echo "ERROR: Nikki feed missing"
            exit 1
          }

          echo "Nikki feed: OK"

      # =====================================================
      # 3.2 保存 feeds 状态
      # =====================================================

      - name: Save feeds state
        run: |
          set -e

          cd immortalwrt

          cp feeds.conf.default ../YAIF-feeds.conf

          echo "===== YAIF feeds ====="
          cat ../YAIF-feeds.conf

      # =====================================================
      # 4. 注入 files
      # =====================================================

      - name: Inject files
        run: |
          set -e

          cd immortalwrt

          chmod +x ../device/r2s/Diy-Part2.sh

          ../device/r2s/Diy-Part2.sh

      # =====================================================
      # 4.1 验证 APK repository
      # =====================================================

      - name: Verify injected files
        run: |
          set -e

          cd immortalwrt

          echo "===== APK repository files ====="

          test -d files/etc/apk/repositories.d || {
            echo "ERROR: files/etc/apk/repositories.d missing"
            exit 1
          }

          find files/etc/apk -type f -print

          echo "===== Repository content ====="

          for f in files/etc/apk/repositories.d/*
          do
              [ -f "$f" ] || continue

              echo "---------- $f ----------"
              cat "$f"
          done

      # =====================================================
      # 5. 应用 config.seed
      #
      # 唯一配置入口：
      #
      # config.seed
      #      ↓
      # .config
      #      ↓
      # make defconfig
      #      ↓
      # 最终 .config
      # =====================================================

      - name: Apply R2S config.seed
        run: |
          set -e

          cd immortalwrt

          test -f ../device/r2s/config.seed

          cp ../device/r2s/config.seed .config

          echo "===== make defconfig ====="

          make defconfig

      # =====================================================
      # 6. 禁止旧代理组件
      # =====================================================

      - name: Check forbidden packages
        run: |
          set -e

          cd immortalwrt

          echo "===== Checking forbidden packages ====="

          FORBIDDEN_PACKAGES="
          CONFIG_PACKAGE_mihomo-alpha
          CONFIG_PACKAGE_luci-app-attendedsysupgrade
          CONFIG_PACKAGE_luci-i18n-attendedsysupgrade-zh-cn
          CONFIG_PACKAGE_arptables-legacy
          CONFIG_PACKAGE_ebtables-legacy
          CONFIG_PACKAGE_ip6tables-legacy
          CONFIG_PACKAGE_iptables-legacy
          CONFIG_PACKAGE_xtables-legacy
          "

          for pkg in $FORBIDDEN_PACKAGES
          do
              if grep -q "^${pkg}=y$" .config; then
                  echo "ERROR: forbidden package enabled: ${pkg}"
                  exit 1
              fi
          done

          echo "Forbidden packages: OK"

      # =====================================================
      # 6.1 验证 config.seed
      #
      # 验证原则：
      #
      # 1. CONFIG_PACKAGE_xxx=y
      #      必须在最终 .config 中保持 =y。
      #
      # 2. # CONFIG_PACKAGE_xxx is not set
      #      不允许最终被重新启用。
      #
      # 3. CONFIG_DEFAULT_xxx=y
      #      单独验证 DEFAULT 选择。
      #
      #      例如：
      #        CONFIG_DEFAULT_autocore=y
      #
      #      不要求：
      #        CONFIG_PACKAGE_autocore=y
      #
      # 4. 不对内建 kernel capability 强制要求
      #      CONFIG_PACKAGE_xxx=y。
      #
      # 5. 不存在的 PACKAGE 不通过 SKIP 掩盖。
      #      如果 seed 中仍然存在旧 PACKAGE，
      #      应当清理 config.seed，而不是让验证器放行。
      #
      # =====================================================

      - name: Verify config.seed
        run: |
          set -e

          cd immortalwrt

          SEED="../device/r2s/config.seed"
          FINAL=".config"

          echo "=========================================="
          echo "1. Verify explicitly enabled PACKAGE"
          echo "=========================================="

          while read -r pkg
          do
              if grep -q "^${pkg}=y$" "$FINAL"
              then
                  echo "OK: ${pkg}=y"

              elif grep -q "^${pkg}=" "$FINAL" || \
                   grep -q "^# ${pkg} is not set$" "$FINAL"
              then
                  echo "ERROR: seed 要求启用，但最终配置未启用: ${pkg}"
                  grep -E "^${pkg}(=|$)|^# ${pkg} is not set$" "$FINAL" || true
                  exit 1

              else
                  echo "ERROR: seed 中存在无法确认的 PACKAGE: ${pkg}"
                  echo "请确认该软件包是否存在于 ImmortalWrt 25.12.1 / 当前 feeds。"
                  exit 1
              fi

          done < <(
              grep '^CONFIG_PACKAGE_.*=y$' "$SEED" |
              cut -d= -f1
          )


          echo "=========================================="
          echo "2. Verify explicitly disabled PACKAGE"
          echo "=========================================="

          while read -r pkg
          do
              if grep -q "^${pkg}=y$" "$FINAL"
              then
                  echo "ERROR: seed 明确禁用，但最终重新启用: ${pkg}"
                  grep "^${pkg}=y$" "$FINAL"
                  exit 1
              fi

              if grep -q "^${pkg}=" "$FINAL" || \
                 grep -q "^# ${pkg} is not set$" "$FINAL"
              then
                  echo "OK: ${pkg} disabled"
              else
                  echo "ERROR: seed 中存在无法确认的 PACKAGE: ${pkg}"
                  echo "请确认该软件包是否存在于 ImmortalWrt 25.12.1 / 当前 feeds。"
                  exit 1
              fi

          done < <(
              grep '^# CONFIG_PACKAGE_.* is not set$' "$SEED" |
              sed 's/^# \(CONFIG_PACKAGE_[^ ]*\) is not set$/\1/'
          )


          echo "=========================================="
          echo "3. Verify DEFAULT selections"
          echo "=========================================="

          while read -r cfg
          do
              if grep -q "^${cfg}=y$" "$FINAL"
              then
                  echo "OK: ${cfg}=y"

              elif grep -q "^# ${cfg} is not set$" "$FINAL"
              then
                  echo "ERROR: DEFAULT 配置被关闭: ${cfg}"
                  exit 1

              elif grep -q "^${cfg}=" "$FINAL"
              then
                  echo "ERROR: DEFAULT 配置值发生变化: ${cfg}"
                  grep "^${cfg}=" "$FINAL"
                  exit 1

              else
                  echo "ERROR: seed 中存在无法确认的 DEFAULT: ${cfg}"
                  exit 1
              fi

          done < <(
              grep '^CONFIG_DEFAULT_.*=y$' "$SEED" |
              cut -d= -f1
          )


          echo "=========================================="
          echo "4. Verify critical YAIF packages"
          echo "=========================================="

          REQUIRED_PACKAGES="
          CONFIG_PACKAGE_nikki
          CONFIG_PACKAGE_mihomo-meta
          CONFIG_PACKAGE_daed
          CONFIG_PACKAGE_bpftool-full
          CONFIG_PACKAGE_kmod-tun
          CONFIG_PACKAGE_kmod-nft-fullcone
          CONFIG_PACKAGE_kmod-tcp-bbr
          "

          for pkg in $REQUIRED_PACKAGES
          do
              if grep -q "^${pkg}=y$" "$FINAL"
              then
                  echo "OK: ${pkg}=y"
              else
                  echo "ERROR: critical package missing: ${pkg}"
                  exit 1
              fi
          done


          echo "=========================================="
          echo "5. Verify important kernel capabilities"
          echo "=========================================="

          REQUIRED_KERNEL_CONFIGS="
          CONFIG_IPV6=y
          CONFIG_KERNEL_BPF=y
          CONFIG_KERNEL_BPF_SYSCALL=y
          CONFIG_KERNEL_BPF_JIT=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y
          "

          while read -r cfg
          do
              if grep -q "^${cfg}$" "$FINAL"
              then
                  echo "OK: ${cfg}"
              else
                  echo "ERROR: kernel capability missing: ${cfg}"
                  exit 1
              fi
          done < <(
              printf '%s\n' "$REQUIRED_KERNEL_CONFIGS"
          )


          echo "=========================================="
          echo "config.seed verification completed"
          echo "=========================================="

      # =====================================================
      # 7. 保存最终配置
      # =====================================================

      - name: Save final build state
        run: |
          set -e

          test -f immortalwrt/.config

          cp immortalwrt/.config \
            YAIF-R2S-final.config

          cp immortalwrt/feeds.conf.default \
            YAIF-feeds-runtime.conf

          tar czf \
            YAIF-feeds-runtime-dir.tar.gz \
            -C immortalwrt \
            feeds

          echo "===== Build state ====="

          ls -lh \
            YAIF-R2S-final.config \
            YAIF-feeds-runtime.conf \
            YAIF-feeds-runtime-dir.tar.gz

      # =====================================================
      # 7.1 上传构建状态
      # =====================================================

      - name: Upload build state
        uses: actions/upload-artifact@v4

        with:
          name: YAIF-R2S-build-state
          retention-days: 90
          if-no-files-found: error

          path: |
            YAIF-R2S-final.config
            YAIF-feeds-runtime.conf
            YAIF-feeds-runtime-dir.tar.gz
            device/r2s/config.seed

      # =====================================================
      # 8. 下载源码包
      #
      # 正式全量编译前完成所有 source download。
      # =====================================================

      - name: Download sources
        run: |
          set -e

          cd immortalwrt

          echo "=========================================="
          echo "Download all sources"
          echo "=========================================="

          make download \
            -j$(nproc) \
            V=s

      # =====================================================
      # 9. SSH 调试
      # =====================================================

      - name: SSH debug
        if: ${{ inputs.ssh == true }}

        uses: mxschmitt/action-tmate@v3

        with:
          limit-access-to-actor: false

      # =====================================================
      # 10. 全量编译
      # =====================================================

      - name: Build firmware
        run: |
          set -e

          cd immortalwrt

          echo "=========================================="
          echo "Start full firmware build"
          echo "=========================================="

          echo "CPU threads:"
          nproc

          make \
            -j$(nproc) \
            V=s

          echo "=========================================="
          echo "Full firmware build completed"
          echo "=========================================="

      # =====================================================
      # 11. 验证固件产物
      # =====================================================

      - name: Verify firmware output
        run: |
          set -e

          TARGET_DIR="immortalwrt/bin/targets/rockchip/armv8"

          echo "===== Target directory ====="

          test -d "$TARGET_DIR"

          ls -lh "$TARGET_DIR"


          echo "===== Sysupgrade images ====="

          test -n "$(find "$TARGET_DIR" \
            -maxdepth 1 \
            -name '*sysupgrade.img.gz' \
            -type f)"

          ls -lh "$TARGET_DIR"/*sysupgrade.img.gz


          echo "===== SHA256 ====="

          test -f "$TARGET_DIR/sha256sums"

          sha256sum \
            "$TARGET_DIR"/*sysupgrade.img.gz


          echo "===== Build info ====="

          test -f "$TARGET_DIR/config.buildinfo"


          echo "===== Manifest ====="

          ls "$TARGET_DIR"/*.manifest


          echo "Firmware output verification: OK"

      # =====================================================
      # 12. 整理固件
      # =====================================================

      - name: Prepare firmware files
        run: |
          set -e

          mkdir -p release

          TARGET_DIR="immortalwrt/bin/targets/rockchip/armv8"

          cp "$TARGET_DIR"/*sysupgrade.img.gz \
            release/

          cp "$TARGET_DIR"/sha256sums \
            release/

          cp "$TARGET_DIR"/config.buildinfo \
            release/

          cp "$TARGET_DIR"/*.manifest \
            release/

          cp immortalwrt/.config \
            release/YAIF-R2S.config


          echo "===== Release files ====="

          ls -lh release


          echo "===== Sysupgrade count ====="

          find release \
            -name '*sysupgrade.img.gz' \
            -type f |
            wc -l

      # =====================================================
      # 13. 上传固件
      # =====================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:
          name: YAIF-25.12.1-R2S-${{ github.run_number }}

          retention-days: 90

          if-no-files-found: error

          path: |
            release/*

      # =====================================================
      # 14. GitHub Release
      # =====================================================

      - name: Create GitHub Release
        if: ${{ inputs.release == true }}

        uses: softprops/action-gh-release@v2

        with:
          tag_name: YAIF-25.12.1-R2S-build-${{ github.run_id }}

          name: YAIF-25.12.1 NanoPi R2S Build ${{ github.run_number }}

          files: |
            release/*

          body: |
            ## YAIF-25.12.1 NanoPi R2S

            ### System

            | Item | Value |
            | --- | --- |
            | Base | ImmortalWrt 25.12.1 |
            | Target | rockchip armv8 |
            | Device | FriendlyARM NanoPi R2S |
            | Kernel | Linux 6.12 |

            ### Build Info

            | Item | Value |
            | --- | --- |
            | Commit | `${{ github.sha }}` |
            | Build | ${{ github.run_number }} |

            ### Firmware

            | File | Description |
            | --- | --- |
            | squashfs-sysupgrade.img.gz | 推荐长期运行版本 |
            | ext4-sysupgrade.img.gz | 可写系统版本 |
            | sha256sums | SHA256 checksum |
            | config.buildinfo | Build information |
            | manifest | Package list |
            | YAIF-R2S.config | Final configuration |

            ### Notes

            YAIF-25.12.1 NanoPi R2S custom build.

            Based on ImmortalWrt 25.12.1.
